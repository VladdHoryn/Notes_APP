version: "3.9"

services:
  mongo:
    image: mongo:7.0
    container_name: mongo-db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: technical-task-app
    ports:
      - "8080:8080"
    depends_on:
      - mongo

volumes:
  mongo-data: